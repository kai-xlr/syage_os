[package]
name = "syage_os"
version = "0.1.0"
edition = "2024"
authors = ["Kahlil Wallace kahlil.wallace@protonmail.com"]

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
uart_16550 = "0.8"
x86_64 = "0.15.5"

[profile.dev]
#panic = "abort"

[profile.release]
#panic = "abort"

[[bin]]
name = "syage_os"
test = true
bench = false

[[test]]
name = "should_panic"
harness = false

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[package.metadata.bootimage]
run-args = ["-display", "none"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
]
test-success-exit-code = 33
